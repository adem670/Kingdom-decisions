<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b2a">

  <title>دستور مملكة أرض السلام | الجريدة الرسمية</title>

  <style>
    :root {
      --green: #123b2a;
      --green-light: #1c513b;
      --gold: #c9a44c;
      --cream: #f8f5ec;
      --white: #fff;
      --text: #26352d;
      --muted: #69766d;
      --border: #e5e0d3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.9;
    }

    header {
      background: linear-gradient(135deg, var(--green), #09251a);
      color: white;
      text-align: center;
      padding: 32px 16px;
      border-bottom: 5px solid var(--gold);
    }

    .seal {
      width: 76px;
      height: 76px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      font-size: 35px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(24px, 5vw, 36px);
    }

    header p {
      margin: 5px 0;
      color: #eee3c6;
    }

    .container {
      width: min(1000px, 94%);
      margin: 25px auto 50px;
    }

    .back {
      display: inline-block;
      color: var(--green);
      text-decoration: none;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .document {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 25px #123b2a0d;
    }

    .document-header {
      text-align: center;
      padding: 28px 18px;
      border-bottom: 1px solid var(--border);
    }

    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 30px;
      background: #e7f2e9;
      color: var(--green);
      font-size: 13px;
      font-weight: bold;
    }

    .document-header h2 {
      color: var(--green);
      margin: 12px 0 5px;
      font-size: clamp(23px, 4vw, 32px);
    }

    .meta {
      color: var(--muted);
      font-size: 14px;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 16px;
      background: #fbfaf6;
      border-bottom: 1px solid var(--border);
    }

    .tools input {
      flex: 1 1 240px;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d8d5c9;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--green);
      color: white;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      background: var(--green-light);
    }

    #status {
      margin: 18px;
      padding: 14px;
      border-radius: 8px;
      background: #fff8e5;
      color: #775b1c;
      text-align: center;
    }

    #constitution {
      padding: clamp(18px, 4vw, 38px);
      min-height: 240px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .search-match {
      outline: 2px solid var(--gold);
      background: #fff8e5;
    }

    footer {
      text-align: center;
      padding: 24px 12px;
      background: var(--green);
      color: #eee3c6;
      font-size: 13px;
    }

    @media print {
      body {
        background: white;
      }

      header,
      footer,
      .tools,
      .back,
      #status {
        display: none !important;
      }

      .container {
        width: 100%;
        margin: 0;
      }

      .document {
        border: none;
        box-shadow: none;
      }

      #constitution {
        padding: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="seal" aria-hidden="true">♛</div>
    <h1>مملكة أرض السلام</h1>
    <p>السلام • العدل • الكرامة</p>
    <p>الجريدة الرسمية للمملكة</p>
  </header>

  <main class="container">
    <a class="back" href="./index.html">← العودة إلى الجريدة الرسمية</a>

    <section class="document">
      <div class="document-header">
        <span class="badge">وثيقة دستورية</span>
        <h2>دستور مملكة أرض السلام</h2>
        <div class="meta">دستور رقم 001 لسنة 2026</div>
        <div class="meta">العاصمة: دار السلام</div>
        <div class="meta">اللغتان الرسميتان: العربية والإنجليزية</div>
      </div>

      <div class="tools">
        <input
          id="search"
          type="search"
          placeholder="ابحث عن فصل أو كلمة..."
          aria-label="البحث في الدستور"
        >
        <button id="printButton" type="button">طباعة الدستور</button>
      </div>

      <div id="status" role="status">جارٍ تحميل الدستور...</div>
      <article id="constitution"></article>
    </section>
  </main>

  <footer>
    © مملكة أرض السلام — الجريدة الرسمية
  </footer>

  <script>
    // إعدادات مشروع Supabase
    const SUPABASE_URL =
      "https://gfjlglniyaerdcjgefgi.supabase.co";

    // استعمل مفتاح النشر العام الموجود في إعدادات مشروعك.
    // لا تستعمل service_role key في صفحة عامة.
    const SUPABASE_ANON_KEY =
      "sb_publishable_UTEgMhPFF34jjCIeX39Nhg_8Tf_cWiX";

    // معرّف سجل الدستور الموجود في قاعدة البيانات
    const PUBLICATION_ID =
      "3b2562aa-3c98-4672-b970-f2286f6904fc";

    const constitution = document.getElementById("constitution");
    const statusBox = document.getElementById("status");
    const searchInput = document.getElementById("search");

    document.getElementById("printButton").addEventListener(
      "click",
      () => window.print()
    );

    async function loadConstitution() {
      statusBox.hidden = false;
      statusBox.textContent = "جارٍ تحميل الدستور...";

      try {
        const endpoint =
          SUPABASE_URL.replace(/\/$/, "") +
          "/rest/v1/royal_publications" +
          "?id=eq." + encodeURIComponent(PUBLICATION_ID) +
          "&status=eq.published" +
          "&select=title,content,reference_number";

        const response = await fetch(endpoint, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": "Bearer " + SUPABASE_ANON_KEY
          }
        });

        if (!response.ok) {
          throw new Error(
            "تعذّر تحميل الدستور. رمز الخطأ: " +
            response.status +
            ". تحقّق من صلاحيات القراءة في Supabase."
          );
        }

        const records = await response.json();

        if (!Array.isArray(records) || records.length === 0) {
          throw new Error(
            "لم يُعثر على سجل دستور منشور. تحقّق من المعرّف وحالة النشر."
          );
        }

        const record = records[0];

        if (!record.content) {
          throw new Error(
            "سجل الدستور موجود، لكن محتوى الدستور فارغ."
          );
        }

        // عرض النص بأمان دون تنفيذ أي HTML داخل المحتوى
        constitution.textContent = record.content;

        if (record.title) {
          document.title =
            record.title + " | الجريدة الرسمية";
        }

        statusBox.hidden = true;
      } catch (error) {
        console.error("Constitution loading error:", error);
        statusBox.hidden = false;
        statusBox.textContent = error.message;
        statusBox.style.background = "#fff0ed";
        statusBox.style.color = "#8a2d20";
      }
    }

    searchInput.addEventListener("input", function () {
      const query = this.value.trim().toLocaleLowerCase("ar");

      constitution.classList.remove("search-match");

      if (!query) return;

      const text = constitution.textContent.toLocaleLowerCase("ar");
      const index = text.indexOf(query);

      if (index !== -1) {
        constitution.classList.add("search-match");
        constitution.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      }
    });

    loadConstitution();
  </script>
</body>
</html>
