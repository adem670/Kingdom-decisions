<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123b2c">
<title>دستور مملكة أرض السلام</title>
<style>
:root {
  --green:#123b2c;
  --green2:#20543d;
  --gold:#d5b56a;
  --cream:#f7f5ee;
  --text:#25352d;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Tahoma,Arial,sans-serif;
  background:var(--cream);
  color:var(--text);
  line-height:2;
}
.topline{height:6px;background:var(--gold)}
header{
  background:var(--green);
  color:white;
  text-align:center;
  padding:35px 18px;
  border-bottom:4px solid var(--gold);
}
header .symbol{font-size:42px}
header h1{margin:8px 0;font-size:clamp(24px,5vw,38px)}
header p{margin:0;color:#e7dec5}
main{
  max-width:950px;
  margin:28px auto;
  padding:0 16px;
}
.panel{
  background:white;
  border:1px solid #e5e8df;
  border-radius:14px;
  padding:clamp(18px,4vw,36px);
  box-shadow:0 4px 18px #152c1b0b;
}
.status{
  text-align:center;
  color:#718077;
  padding:25px 10px;
}
.content{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:17px;
}
.actions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin:22px 0;
}
.actions a,.actions button{
  display:inline-block;
  padding:10px 18px;
  border-radius:8px;
  border:1px solid var(--green);
  text-decoration:none;
  font:inherit;
  cursor:pointer;
}
.actions a{
  background:var(--green);
  color:white;
}
.actions button{
  background:white;
  color:var(--green);
}
footer{
  background:var(--green);
  color:white;
  text-align:center;
  padding:22px;
  border-top:4px solid var(--gold);
}
footer a{color:var(--gold)}
</style>
</head>
<body>
<div class="topline"></div>

<header>
  <div class="symbol">📜</div>
  <h1>دستور مملكة أرض السلام</h1>
  <p>الوثيقة الدستورية الأساسية للمملكة</p>
</header>

<main>
  <div class="actions">
    <a href="./">العودة إلى الجريدة الرسمية</a>
    <button id="printButton" type="button">طباعة الدستور / حفظ PDF</button>
  </div>

  <section class="panel">
    <div id="status" class="status">جارٍ تحميل نص الدستور الكامل...</div>
    <article id="constitution" class="content"></article>
  </section>

  <div class="actions">
    <a href="./">العودة إلى الجريدة الرسمية</a>
  </div>
</main>

<footer>
  <p>مملكة PeaceLand — الدستور الأساسي</p>
  <p><a href="https://endearing-axolotl-b97f7f.netlify.app/">الموقع الرسمي للمملكة</a></p>
</footer>

<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://gfjlglniyaerdcjgefgi.supabase.co",
  "sb_publishable_UTEgMhPFF34jjCIeX39Nhg_8Tf_cWiX"
);

const documentId = "3b2562aa-3c98-4672-b970-f2286f6904fc";
const status = document.getElementById("status");
const content = document.getElementById("constitution");

document.getElementById("printButton").addEventListener("click", () => {
  window.print();
});

async function loadConstitution() {
  try {
    const { data, error } = await supabase
      .from("royal_publications")
      .select("title,content,summary,status")
      .eq("id", documentId)
      .eq("status", "published")
      .maybeSingle();

    if (error) throw error;

    if (!data) {
      status.textContent =
        "لم يتم العثور على الدستور المنشور. تأكّد من صلاحيات القراءة العامة في Supabase.";
      return;
    }

    document.title = data.title || "دستور مملكة أرض السلام";
    content.textContent = data.content || data.summary || "";
    status.hidden = true;

    if (!content.textContent.trim()) {
      status.hidden = false;
      status.textContent = "لا يوجد نص متاح لهذا المنشور.";
    }
  } catch (error) {
    console.error(error);
    status.textContent =
      "تعذّر تحميل الدستور. تحقّق من الاتصال بالإنترنت وصلاحيات القراءة العامة.";
  }
}

loadConstitution();
</script>
</body>
</html>
