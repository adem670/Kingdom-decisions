<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="الدستور الملكي لمملكة PeaceLand المنشور في الجريدة الرسمية">
  <title>الدستور الملكي | الجريدة الرسمية لمملكة PeaceLand</title>

  <style>
    :root {
      --green: #123d2c;
      --green2: #1b573e;
      --gold: #c6a34a;
      --cream: #f8f5eb;
      --white: #fff;
      --text: #26352c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.9;
    }

    header {
      background: var(--green);
      color: white;
      text-align: center;
      padding: 32px 16px;
      border-bottom: 5px solid var(--gold);
    }

    .crown {
      font-size: 42px;
    }

    header h1 {
      margin: 5px 0;
      color: #f1d887;
    }

    header p {
      margin: 4px 0;
    }

    main {
      width: min(1000px, 92%);
      margin: 30px auto;
    }

    .document {
      background: var(--white);
      border: 1px solid #e5dcc4;
      border-top: 5px solid var(--gold);
      border-radius: 12px;
      padding: clamp(18px, 4vw, 42px);
      box-shadow: 0 5px 20px #173d2c12;
    }

    .badge {
      display: inline-block;
      background: #e9f1e9;
      color: var(--green);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 14px;
      font-weight: bold;
    }

    h2 {
      color: var(--green);
      margin-top: 14px;
    }

    .meta {
      background: #faf7ed;
      border-right: 4px solid var(--gold);
      padding: 12px 16px;
      margin: 20px 0;
      overflow-wrap: anywhere;
    }

    #content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 2;
      font-size: 17px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0;
    }

    button, .back {
      border: 0;
      border-radius: 7px;
      padding: 10px 18px;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
    }

    button {
      background: var(--green);
      color: white;
    }

    button:hover {
      background: var(--green2);
    }

    .back {
      display: inline-block;
      background: #eee5cd;
      color: var(--green);
    }

    #status {
      padding: 18px;
      text-align: center;
      background: #faf7ed;
      border-radius: 8px;
    }

    .error {
      color: #9a2828;
    }

    footer {
      text-align: center;
      background: var(--green);
      color: white;
      padding: 18px;
      margin-top: 40px;
      border-top: 4px solid var(--gold);
    }

    @media print {
      header {
        background: white;
        color: black;
        border-bottom: 2px solid black;
      }

      header h1 { color: black; }
      .actions, .back, footer { display: none !important; }

      body, .document {
        background: white;
        box-shadow: none;
        border-color: #ccc;
      }

      main {
        width: 100%;
        margin: 0;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="crown">♛</div>
    <h1>الدستور الملكي لمملكة PeaceLand</h1>
    <p>الجريدة الرسمية للمملكة</p>
    <p>النص الدستوري المنشور بقرار ملكي</p>
  </header>

  <main>
    <div class="document">
      <span class="badge">وثيقة ملكية منشورة</span>
      <h2 id="decision-title">الدستور الملكي</h2>

      <div class="meta">
        <div><strong>الرقم المرجعي:</strong> <span id="reference">جارٍ التحميل...</span></div>
        <div><strong>الحالة:</strong> منشور في الجريدة الرسمية</div>
      </div>

      <div class="actions">
        <button onclick="window.print()">🖨️ طباعة القرار</button>
        <a class="back" href="./index.html">العودة إلى الجريدة الرسمية</a>
      </div>

      <div id="status">جارٍ تحميل القرار الملكي المنشور...</div>
      <article id="content" hidden></article>
    </div>
  </main>

  <footer>
    مملكة PeaceLand — الجريدة الرسمية
  </footer>

  <script>
    const SUPABASE_URL = "https://gfjlglniyaerdcjgefgi.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UTEgMhPFF34jjCIeX39Nhg_8Tf_cWiX";

    // معرّف القرار الملكي المنشور من موقع الإدارة
    const PUBLICATION_ID = "3b2562aa-3c98-4672-b970-f2286f6904fc";

    async function loadConstitutionDecision() {
      const status = document.getElementById("status");
      const content = document.getElementById("content");

      const endpoint =
        `${SUPABASE_URL}/rest/v1/royal_publications` +
        `?id=eq.${encodeURIComponent(PUBLICATION_ID)}` +
        `&status=eq.published` +
        `&select=title,content,reference_number`;

      try {
        const response = await fetch(endpoint, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) {
          throw new Error(`تعذّر جلب القرار (HTTP ${response.status})`);
        }

        const records = await response.json();

        if (!records.length) {
          throw new Error(
            "لم يتم العثور على القرار. تأكّد أنّه منشور وأنّ صلاحيات القراءة العامة مفعّلة."
          );
        }

        const decision = records[0];

        document.getElementById("decision-title").textContent =
          decision.title || "الدستور الملكي لمملكة PeaceLand";

        document.getElementById("reference").textContent =
          decision.reference_number || "غير محدّد";

        // عرض المحتوى كنصّ آمن مع المحافظة على الأسطر والفصول
        content.textContent = decision.content || "لا يوجد محتوى للقرار.";
        content.hidden = false;
        status.hidden = true;

        document.title =
          (decision.title || "الدستور الملكي") +
          " | الجريدة الرسمية لمملكة PeaceLand";

      } catch (error) {
        status.classList.add("error");
        status.textContent =
          error.message +
          " إذا استمرّ المشكل، راجع إعدادات صلاحيات القراءة في Supabase.";
      }
    }

    loadConstitutionDecision();
  </script>
</body>
</html>
